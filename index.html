<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automazione Contenuti Professionali</title>
    <style>
        :root { --bg: #0d0d0d; --text: #e0e0e0; --accent: #00ffcc; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 600px; margin: 0 auto; padding: 20px; line-height: 1.6; }
        h1 { color: #fff; font-size: 1.8rem; border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-top: 40px; }
        .box { background: #1a1a1a; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
        button { background: var(--accent); color: #0d0d0d; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; font-size: 1rem; }
        button:hover { background: #00cca3; }
        footer { margin-top: 60px; text-align: center; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <h1>Generazione Contenuti per Professionisti</h1>
    <p>Liberiamo il tuo tempo. Scriviamo la tua newsletter, i tuoi post social e i tuoi testi aziendali usando intelligenza artificiale calibrata sul tuo settore specifico.</p>

    <div class="box">
        <h3>Richiedi una prova gratuita</h3>
        
        <form action="https://formspree.io/f/{form_id}" method="post">
  <label for="email">Your Email</label>
  <input name="Email" id="email" type="email">
  <button type="submit">Submit</button>
</form>

            <label for="settore" style="display:block; margin-top:15px;">Il tuo Settore / Attività:</label>
            <input type="text" id="settore" name="settore" required placeholder="es. Agenzia Immobiliare, Avvocato...">

            <label for="esigenza" style="display:block; margin-top:15px;">Cosa dobbiamo scrivere per te?</label>
            <textarea id="esigenza" name="esigenza" rows="4" required placeholder="Descrivi brevemente i testi di cui hai bisogno..."></textarea>

            <button type="submit">Invia Richiesta</button>
        </form>
    </div>

    <footer>Sviluppato su Architettura Privata Q7</footer>

</body>
</html>
